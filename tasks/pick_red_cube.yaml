# Task: Move the red cube into the target zone

task:
  name: pick_red_cube
  description: "Move the red cube into the target bin area"
  scenario: basic_workspace
  target_object: red_cube
  time_limit: 30.0

  success_criteria:
    - type: object_in_zone
      description: "Red cube is within target zone (xy-plane)"
      params:
        object_id: red_cube
        zone_center: [0.6, 0.0, 0.245]
        zone_radius: 0.10
        use_3d: false

    - type: object_above_height
      description: "Red cube is on or above the table surface"
      params:
        object_id: red_cube
        min_height: 0.20

  metadata:
    difficulty: easy
    category: manipulation
    phase: 2
