# Task: Place both cubes into the target zone
# More challenging — requires sequencing two pick-and-place operations.

task:
  name: pick_both_cubes
  description: "Move both cubes into the target bin area"
  scenario: basic_workspace
  target_object: red_cube
  time_limit: 60.0

  success_criteria:
    - type: object_in_zone
      description: "Red cube is within target zone"
      params:
        object_id: red_cube
        zone_center: [0.82, 0.0, 0.345]
        zone_radius: 0.15
        use_3d: false

    - type: object_in_zone
      description: "Blue cube is within target zone"
      params:
        object_id: blue_cube
        zone_center: [0.82, 0.0, 0.345]
        zone_radius: 0.15
        use_3d: false

  metadata:
    difficulty: medium
    category: manipulation
    phase: 2
