# Scenario 002 — Spread Workspace
# Objects placed further apart, making manipulation harder.

scenario:
  name: spread_workspace
  description: "Objects spread wider on the table — harder reach"

robot:
  model: panda
  model_source: menagerie
  base_position: [0.0, 0.0, 0.0]
  home_qpos: [0.0, 0.0, 0.0, -1.57079, 0.0, 1.57079, -0.7853, 0.04, 0.04]
  home_ctrl: [0.0, 0.0, 0.0, -1.57079, 0.0, 1.57079, -0.7853, 0]

simulation:
  timestep: 0.002
  world_path: "simulation/worlds/tabletop.xml"

objects:
  red_cube:
    type: box
    size: [0.02, 0.02, 0.02]
    position: [0.5, 0.25, 0.245]
    orientation: [1.0, 0.0, 0.0, 0.0]
    material: red_mat
    mass: 0.05

  blue_cube:
    type: box
    size: [0.02, 0.02, 0.02]
    position: [0.5, -0.25, 0.245]
    orientation: [1.0, 0.0, 0.0, 0.0]
    material: blue_mat
    mass: 0.05

  target_bin:
    type: box
    size: [0.06, 0.06, 0.005]
    position: [0.65, 0.0, 0.225]
    orientation: [1.0, 0.0, 0.0, 0.0]
    material: green_mat
    mass: 0.5
    static: true

controller:
  type: general_affine
