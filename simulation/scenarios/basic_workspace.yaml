# Scenario 001 — Basic Workspace
# Deterministic initial configuration for the Forge tabletop environment.
# Uses the MuJoCo Menagerie Franka Emika Panda model.
# Robot sits at world origin; table at z=0.2 so the robot reaches over it.

scenario:
  name: basic_workspace
  description: "Panda robot with two cubes and a target bin on a tabletop"

robot:
  model: panda
  model_source: menagerie  # use MuJoCo Menagerie model
  base_position: [0.0, 0.0, 0.0]
  # Home configuration matching Menagerie keyframe
  home_qpos: [0.0, 0.0, 0.0, -1.57079, 0.0, 1.57079, -0.7853, 0.04, 0.04]
  home_ctrl: [0.0, 0.0, 0.0, -1.57079, 0.0, 1.57079, -0.7853, 0]

simulation:
  timestep: 0.002
  world_path: "simulation/worlds/tabletop.xml"

objects:
  red_cube:
    type: box
    size: [0.02, 0.02, 0.02]
    position: [0.5, 0.15, 0.245]
    orientation: [1.0, 0.0, 0.0, 0.0]
    material: red_mat
    mass: 0.05

  blue_cube:
    type: box
    size: [0.02, 0.02, 0.02]
    position: [0.5, -0.15, 0.245]
    orientation: [1.0, 0.0, 0.0, 0.0]
    material: blue_mat
    mass: 0.05

  target_bin:
    type: box
    size: [0.06, 0.06, 0.005]
    position: [0.6, 0.0, 0.225]
    orientation: [1.0, 0.0, 0.0, 0.0]
    material: green_mat
    mass: 0.5
    static: true

controller:
  type: general_affine
  # Menagerie Panda uses general actuators with affine bias
